{% if post_form.non_field_errors %}<div class="post-form-errors" role="alert">{{ post_form.non_field_errors }}</div>{% endif %}
{% for field in post_form %}
<div class="post-form-field"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.name == 'caption' %}<span>Text, photo, or video — make it yours.</span>{% endif %}</label>{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{{ field.errors }}</div>
{% endfor %}

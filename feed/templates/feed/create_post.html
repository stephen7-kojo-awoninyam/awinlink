{% extends "base.html" %}
{% block title %}Create a post · Awinlink{% endblock %}
{% block content %}
<section class="post-creation-page"><h1>Create a post</h1><form method="post" enctype="multipart/form-data" action="{% url 'create_post' %}" data-post-form id="createPostForm">{% csrf_token %}{% include 'feed/post_fields.html' with post_form=form %}<button type="submit" class="post-submit-button" data-post-submit id="postButton">Post</button></form></section>
{% endblock %}

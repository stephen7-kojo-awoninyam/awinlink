{% extends "base.html" %}

{% block title %}Submit work | {{ competition.title }}{% endblock %}

{% block content %}
<div class="container py-4">
    <h1 class="h2">Submit your work</h1>
    <p class="text-muted">{{ competition.title }}</p>
    <form method="post" class="card card-body shadow-sm">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
            </div>
        {% endfor %}
        <button class="btn btn-primary align-self-start" type="submit">Save submission</button>
    </form>
</div>
{% endblock %}

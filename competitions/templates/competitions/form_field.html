<div class="cp-field {% if field.name == 'description' or field.name == 'requirements' or field.name == 'rules' or field.name == 'prizes' or field.name == 'submission' or field.name == 'feedback' %}cp-field-wide{% endif %}">
    {% if field.field.widget.input_type == "checkbox" %}<div class="cp-checkbox">{{ field }}<label for="{{ field.id_for_label }}">{{ field.label }}</label>
</div>{% else %}<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span aria-hidden="true"> *</span>{% endif %}</label>{{ field }}{% endif %}
    {% if field.help_text %}<div class="cp-help">{{ field.help_text }}</div>{% endif %}
    {% if field.errors %}<div class="cp-errors" role="alert">{{ field.errors }}</div>{% endif %}
</div>

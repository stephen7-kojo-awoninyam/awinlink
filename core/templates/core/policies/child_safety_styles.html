<style>
.child-safety-page{margin-top:24px;overflow-wrap:anywhere}
.child-safety-page *{box-sizing:border-box}
.child-safety-page a:focus-visible{outline:3px solid #f3b61f;outline-offset:4px}
.cs-hero{padding:32px;border-radius:20px;background:#1646a0;color:#fff}
.cs-hero h1{font-size:clamp(1.9rem,5vw,2.7rem);margin:12px 0}
.cs-hero p{margin:12px 0}
.cs-eyebrow{font-size:.85rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.cs-hero a{display:inline-block;background:#fff;color:#1646a0;padding:12px 18px;border-radius:10px;font-weight:700}
.cs-section{padding:24px 0;border-bottom:1px solid #dbe6fb;scroll-margin-top:20px}
.cs-section h2{color:#1646a0;font-size:1.4rem;margin:0 0 12px}
.cs-section li+li{margin-top:10px}
.cs-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:20px}
.cs-card{background:#f2f6ff;border:1px solid #dbe6fb;border-radius:14px;padding:20px;min-width:0}
.cs-card h3{font-size:1.1rem;color:#1646a0;margin:0 0 10px}
.cs-card p{margin:8px 0}
.cs-note{border-left:4px solid #2458d3;padding:14px 18px;background:#f2f6ff}
.cs-contents{margin:20px 0;gap:12px 20px;font-size:.95rem}
@media(max-width:600px){.cs-hero{padding:22px 18px;border-radius:14px}.cs-cards{grid-template-columns:1fr}.cs-section{padding:20px 0}.cs-card{padding:16px}}
</style>

<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Awinlink</title>


<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: #ffffff;
    }

    /* ==============================
       TOP NAVIGATION
    ============================== */

    .top-nav {
        height: 82px;
        background: #ffffff;
        display: flex;
        align-items: center;
        padding: 0 55px;
        position: relative;
        z-index: 10;
    }

    .awinlink-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
    }

    .awinlink-logo {
        width: 42px;
        height: 42px;
        background: #0b63ce;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 25px;
        font-weight: 800;
        border-radius: 8px;
    }

    .awinlink-name {
        color: #0b63ce;
        font-size: 25px;
        font-weight: 700;
        letter-spacing: -0.5px;
    }

    /* ==============================
       HERO AREA
    ============================== */

    .landing-main {
        min-height: calc(100vh - 82px);
        background: #0866d8;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
    }

    /* ==============================
       WELCOME MESSAGE
    ============================== */

    .welcome-section {
        width: 52%;
        padding-left: 9%;
        position: relative;
        z-index: 3;
    }

    .welcome-title {
        color: #ffffff;
        font-size: clamp(42px, 5vw, 76px);
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: -2px;
        margin-bottom: 20px;
    }

    .welcome-subtitle {
        color: #ffffff;
        font-size: clamp(20px, 2vw, 31px);
        font-weight: 400;
        line-height: 1.4;
        max-width: 650px;
        margin-bottom: 20px;
    }

    .welcome-description {
        color: rgba(255, 255, 255, 0.92);
        font-size: 18px;
        line-height: 1.7;
        max-width: 610px;
        margin-bottom: 32px;
    }
    /* Hidden until loading is complete */
    #welcome-content {
        opacity: 0;
        transform: translateY(15px);
        transition: opacity 0.8s ease, transform 0.8s ease;
    }

    #welcome-content.show {
        opacity: 1;
        transform: translateY(0);
    }

    /* ==============================
       BUTTONS
    ============================== */

    .action-buttons {
        display: flex;
        gap: 15px;
        align-items: center;
    }

    .action-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 145px;
        padding: 14px 28px;
        border-radius: 8px;
        text-decoration: none;
        font-size: 17px;
        font-weight: 600;
        transition: all 0.2s ease;
    }

    .login-button {
        background: #ffffff;
        color: #0866d8;
    }

    .register-button {
        background: transparent;
        color: #ffffff;
        border: 2px solid #ffffff;
    }

    .action-button:hover {
        transform: translateY(-2px);
    }

    .login-button:hover {
        background: #f2f6ff;
    }

    .register-button:hover {
        background: rgba(255, 255, 255, 0.12);
    }

    /* ==============================
       PEOPLE
    ============================== */

    .people-section {
        position: absolute;
        right: 5%;
        top: 50%;
        transform: translateY(-50%);
        width: 43%;
        height: 75%;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 18px;
        z-index: 2;
    }

    .person {
        position: relative;
        overflow: hidden;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.12);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
        border: 3px solid rgba(255, 255, 255, 0.25);
    }

    .person img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    /* ==============================
       RESPONSIVE DESIGN
    ============================== */

    @media (max-width: 900px) {

        .top-nav {
            height: 70px;
            padding: 0 25px;
        }

        .awinlink-logo {
            width: 36px;
            height: 36px;
            font-size: 21px;
        }

        .awinlink-name {
            font-size: 21px;
        }

        .landing-main {
            min-height: calc(100vh - 70px);
            overflow-y: auto;
            align-items: flex-start;
        }

        .welcome-section {
            width: 100%;
            padding: 55px 30px 250px;
            text-align: center;
        }

        .welcome-title {
            font-size: 45px;
        }

        .welcome-subtitle {
            margin: auto auto 20px;
            font-size: 21px;
        }

        .welcome-description {
            margin-left: auto;
            margin-right: auto;
            font-size: 16px;
        }

        .action-buttons {
            justify-content: center;
            flex-wrap: wrap;
        }

        .people-section {
            width: 72%;
            height: 38%;
            right: 50%;
            top: auto;
            bottom: 35px;
            transform: translateX(50%);
            gap: 10px;
        }

        .person {
            border-radius: 15px;
        }
    }

    @media (max-width: 500px) {

        .top-nav {
            padding: 0 18px;
        }

        .welcome-section {
            padding: 45px 20px 220px;
        }

        .welcome-title {
            font-size: 36px;
            letter-spacing: -1px;
        }

        .welcome-subtitle {
            font-size: 18px;
        }

        .welcome-description {
            font-size: 15px;
            line-height: 1.6;
        }

        .action-button {
            width: 100%;
            min-width: 0;
        }

        .action-buttons {
            flex-direction: column;
            width: 100%;
        }

        .people-section {
            width: 85%;
            height: 32%;
            bottom: 25px;
        }
    }
</style>


</head>

<body>


<!-- TOP NAVIGATION -->
<nav class="top-nav">

    <a href="#" class="awinlink-brand">

        <div class="awinlink-logo">
            A
        </div>

        <span class="awinlink-name">
            awinlink
        </span>

    </a>

</nav>


<!-- LANDING AREA -->
<main class="landing-main">

    <!-- WELCOME MESSAGE -->
    <section class="welcome-section" id="welcome-content">


    <h1 class="welcome-title">
        Welcome to Awinlink
    </h1>

    <p class="welcome-subtitle">
        Where Talent Meets Opportunities
    </p>

    <p class="welcome-description">
        Awinlink helps talented people showcase what they can do,
        connect with the right people, discover opportunities,
        learn, compete, and grow.
    </p>

    <div class="action-buttons">

        <a href="{% url 'login' %}" class="action-button login-button">
            Login
        </a>

        <a href="{% url 'register' %}" class="action-button register-button">
            Create Account
        </a>

    </div>


    </section>



    <!-- PEOPLE -->
    <section class="people-section">

        <div class="person">
            <img
                src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&fit=crop&w=700&q=85"
                alt="Awinlink talent"
            >
        </div>

        <div class="person">
            <img
                src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=700&q=85"
                alt="Awinlink talent"
            >
        </div>

        <div class="person">
            <img
                src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=700&q=85"
                alt="Awinlink talent"
            >
        </div>

        <div class="person">
            <img
                src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=700&q=85"
                alt="Awinlink talent"
            >
        </div>

    </section>

</main>


</body>

</html>

<script>
    setTimeout(function () {

        const loadingIndicator =
            document.querySelector(".loading-indicator");

        const welcomeContent =
            document.getElementById("welcome-content");

        // Hide loading
        loadingIndicator.style.opacity = "0";

        setTimeout(function () {
            loadingIndicator.style.display = "none";

            // Show landing content
            welcomeContent.classList.add("show");

        }, 500);

    }, 3000);
</script>

{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <!-- =====================================================
         QUIZ HEADER
    ====================================================== -->

    <div class="mb-4">

        <a
            href="{% url 'lesson_detail' lesson.id %}"
            class="text-decoration-none"
        >

            <i class="bi bi-arrow-left me-1"></i>

            Back to Lesson

        </a>

    </div>


    <div class="card border-0 shadow-sm">

        <div class="card-body p-4">

            <h1 class="fw-bold">
                {{ quiz.title }}
            </h1>

            <p class="text-muted">
                {{ course.title }}
            </p>


            <!-- =================================================
                 PASSING SCORE
            ================================================== -->

            <div class="alert alert-info">

                <i class="bi bi-info-circle me-1"></i>

                Passing Score:

                <strong>
                    {{ quiz.passing_score }}%
                </strong>

            </div>


            <!-- =================================================
                 QUIZ FORM
            ================================================== -->

            <form method="POST">

                {% csrf_token %}


                {% for question in questions %}

                <div class="card border mb-4">

                    <div class="card-body">

                        <h5 class="fw-bold mb-3">

                            {{ forloop.counter }}.
                            {{ question.question }}

                        </h5>


                        <!-- OPTION A -->

                        <div class="form-check mb-2">

                            <input
                                class="form-check-input"
                                type="radio"
                                name="question_{{ question.id }}"
                                value="A"
                                id="question_{{ question.id }}_a"
                                required
                            >

                            <label
                                class="form-check-label"
                                for="question_{{ question.id }}_a"
                            >

                                {{ question.option_a }}

                            </label>

                        </div>


                        <!-- OPTION B -->

                        <div class="form-check mb-2">

                            <input
                                class="form-check-input"
                                type="radio"
                                name="question_{{ question.id }}"
                                value="B"
                                id="question_{{ question.id }}_b"
                            >

                            <label
                                class="form-check-label"
                                for="question_{{ question.id }}_b"
                            >

                                {{ question.option_b }}

                            </label>

                        </div>


                        <!-- OPTION C -->

                        <div class="form-check mb-2">

                            <input
                                class="form-check-input"
                                type="radio"
                                name="question_{{ question.id }}"
                                value="C"
                                id="question_{{ question.id }}_c"
                            >

                            <label
                                class="form-check-label"
                                for="question_{{ question.id }}_c"
                            >

                                {{ question.option_c }}

                            </label>

                        </div>


                        <!-- OPTION D -->

                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="radio"
                                name="question_{{ question.id }}"
                                value="D"
                                id="question_{{ question.id }}_d"
                            >

                            <label
                                class="form-check-label"
                                for="question_{{ question.id }}_d"
                            >

                                {{ question.option_d }}

                            </label>

                        </div>

                    </div>

                </div>

                {% endfor %}


                <!-- =================================================
                     SUBMIT
                ================================================== -->

                <div class="text-center">

                    <button
                        type="submit"
                        class="btn btn-primary px-5"
                    >

                        <i class="bi bi-check-circle me-1"></i>

                        Submit Quiz

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}

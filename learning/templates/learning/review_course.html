{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4">

                    <h2 class="fw-bold">
                        Review Course
                    </h2>

                    <p class="text-muted">
                        {{ course.title }}
                    </p>


                    <form method="POST">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <div class="mt-4">

                            <button type="submit"
                                    class="btn btn-primary">

                                Submit Review

                            </button>

                            <a href="{% url 'course_detail' course.slug %}"
                               class="btn btn-outline-secondary">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}

<div class="ev-field {% if field.name == 'description' or field.name == 'image' %}ev-field-wide{% endif %}">
    {% if field.field.widget.input_type == "checkbox" %}<div class="ev-checkbox">{{ field }}<label for="{{ field.id_for_label }}">{{ field.label }}</label>
</div>{% else %}<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span aria-hidden="true"> *</span>{% endif %}</label>{{ field }}{% endif %}
    {% if field.help_text %}<div class="ev-help">{{ field.help_text }}</div>{% endif %}
    {% if field.name == 'capacity' %}<div class="ev-help">Use 0 for unlimited capacity.</div>{% endif %}
    {% if field.errors %}<div class="ev-field-errors" role="alert">{{ field.errors }}</div>{% endif %}
</div>

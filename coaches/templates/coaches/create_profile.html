{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow-sm">

        <div class="card-body">

            <h2>Create Coach Profile</h2>

            <p class="text-muted">
                Complete your Coach profile based on your area of
                coaching and mentorship.
            </p>

            <p>
                <strong>Category:</strong>
                {{ coach.get_coach_category_display }}
            </p>

            <form
                method="post"
                enctype="multipart/form-data"
            >
                {% csrf_token %}

                {{ form.as_p }}

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Create Profile
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
